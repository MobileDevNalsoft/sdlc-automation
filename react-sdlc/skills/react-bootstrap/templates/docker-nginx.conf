# docker-nginx.conf — react-bootstrap template
#
# Generic SPA nginx config: SPA fallback, cache-control map, gzip, security
# headers, plus ONE addition — an /api/ location that reverse-proxies to the
# real backend and injects an auth header itself, so a credential never has
# to exist in browser-reachable JS. See react-bootstrap/SKILL.md's "security
# fix" section for the principle this implements.
#
# This replaces any pattern where the SPA's own HTTP client reads a
# credential from a build-time-inlined env var and sends it directly from the
# browser. In production, the app's HTTP client should call the SAME relative
# `/api/...` path it already calls in dev (via the dev server's own proxy) —
# nginx below is what turns that into an authenticated upstream call instead
# of the browser doing it.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile       on;
    tcp_nopush     on;
    keepalive_timeout 65;
    server_tokens  off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    map $uri $cache_control {
        ~^/[^/]+/assets/    "public, max-age=31536000, immutable";
        ~(index\.html|sw\.js|workbox[^/]*\.js|manifest\.json|registerSW\.js)$  "no-cache, no-store, must-revalidate";
        default              "";
    }

    server {
        listen 8080;
        server_name _;
        root  /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-XSS-Protection       "1; mode=block"                   always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        add_header Cache-Control $cache_control;

        # ── Backend auth-proxy — THE security fix ─────────────────────────
        # The browser calls this container's own origin at /api/..., exactly
        # like the dev server's own proxy target does in local development.
        # nginx forwards it upstream and adds the auth header itself — the
        # credential never transits through anything the browser can read (no
        # build-time-inlined env var, no window.__ENV__ global; a
        # window.__ENV__ global would still be browser-readable and does not
        # close this hole).
        location /api/ {
            # ASSUMPTION: replace with your real upstream host/scheme.
            proxy_pass https://<backend-host>/;
            proxy_ssl_server_name on;
            proxy_set_header Host <backend-host>;

            # Populated at container start by
            # docker-entrypoint.d/50-inject-api-auth.sh from a Docker secret.
            # Must exist (even as an empty file) at image-build time — see
            # the Dockerfile's `touch .../api-auth.conf` step — or nginx's
            # config test fails on `include` of a nonexistent file and the
            # container never starts.
            include /etc/nginx/conf.d/api-auth.conf;

            proxy_connect_timeout 10s;
            proxy_read_timeout    30s;
        }

        location / {
            try_files $uri $uri/ @spa_fallback;
        }

        location @spa_fallback {
            rewrite ^/([^/]+)/.*$ /$1/index.html last;
        }
    }
}
